
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Task Manager</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #20243a;
}

header {
    background: #ffffff;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #6254e8;
}

header span {
    color: #777;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.welcome p {
    color: #777;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 28px;
}

.stat-card {
    background: white;
    padding: 23px;
    border-radius: 14px;
    box-shadow: 0 4px 15px #00000008;
}

.stat-card p {
    color: #777;
    font-size: 14px;
}

.stat-card h2 {
    margin-top: 12px;
    font-size: 30px;
}

.purple { color: #6254e8; }
.green { color: #16a36a; }
.orange { color: #ed8b26; }

.main-grid {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 22px;
    align-items: start;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 15px #00000008;
}

.panel h2 {
    font-size: 21px;
    margin-bottom: 22px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 17px;
    border: 1px solid #dfe2eb;
    border-radius: 8px;
    font: inherit;
    outline: none;
    background: white;
}

input:focus, textarea:focus, select:focus {
    border-color: #6254e8;
}

textarea {
    resize: vertical;
    min-height: 85px;
}

.btn {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
}

.btn:hover {
    opacity: 0.85;
    transform: translateY(-1px);
}

.primary {
    background: #6254e8;
    color: white;
    width: 100%;
}

.secondary {
    background: #eeeaff;
    color: #6254e8;
}

.danger {
    background: #fff0f0;
    color: #dc3545;
}

.task-toolbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.task-toolbar input {
    margin: 0;
    flex: 1;
    min-width: 0;
}

.task-toolbar select {
    width: 135px;
    margin: 0;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.task {
    border: 1px solid #e8e9f0;
    border-radius: 11px;
    padding: 17px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.task-check {
    width: 18px;
    height: 18px;
    margin: 3px 0 0;
    accent-color: #6254e8;
    cursor: pointer;
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-content h3 {
    font-size: 16px;
    overflow-wrap: anywhere;
    margin-bottom: 7px;
}

.task-content p {
    color: #777;
    font-size: 13px;
    overflow-wrap: anywhere;
    margin-bottom: 10px;
}

.completed h3 {
    text-decoration: line-through;
    color: #999;
}

.tag {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
    background: #eeeaff;
    color: #6254e8;
    margin-right: 5px;
}

.high {
    background: #fff0f0;
    color: #d94343;
}

.medium {
    background: #fff4df;
    color: #bd7814;
}

.low {
    background: #e5f8ee;
    color: #168552;
}

.task-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.small-btn {
    border: none;
    border-radius: 6px;
    padding: 7px 9px;
    cursor: pointer;
    font-size: 12px;
}

.edit-btn {
    background: #eeeaff;
    color: #6254e8;
}

.delete-btn {
    background: #fff0f0;
    color: #d94343;
}

.empty {
    text-align: center;
    padding: 35px 10px;
    color: #888;
}

.progress {
    height: 8px;
    background: #ececf4;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 12px;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #6254e8;
    transition: width 0.3s;
}

.progress-text {
    font-size: 12px;
    color: #777;
    margin-top: 8px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #888;
    font-size: 13px;
}

@media (max-width: 760px) {
    header {
        padding: 18px 5%;
    }

    .container {
        margin: 25px auto;
        padding: 0 14px;
    }

    .welcome h1 {
        font-size: 26px;
    }

    .stats {
        gap: 9px;
    }

    .stat-card {
        padding: 14px 10px;
    }

    .stat-card p {
        font-size: 12px;
    }

    .stat-card h2 {
        font-size: 24px;
    }

    .main-grid {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 18px;
    }

    .task-toolbar {
        flex-direction: column;
    }

    .task-toolbar select {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">✦ TaskFlow</div>
    <span>My Workspace</span>
</header>

<main class="container">

    <section class="welcome">
        <h1>My Tasks 👋</h1>
        <p>Organize your work. Achieve your goals.</p>
    </section>

    <section class="stats">
        <div class="stat-card">
            <p>Total Tasks</p>
            <h2 class="purple" id="totalCount">0</h2>
        </div>

        <div class="stat-card">
            <p>Completed</p>
            <h2 class="green" id="completedCount">0</h2>
        </div>

        <div class="stat-card">
            <p>Pending</p>
            <h2 class="orange" id="pendingCount">0</h2>
        </div>
    </section>

    <section class="panel" style="margin-bottom:22px">
        <h2>Overall Progress</h2>
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="progress-text" id="progressText">0% completed</p>
    </section>

    <div class="main-grid">

        <section class="panel">
            <h2 id="formHeading">＋ Add New Task</h2>

            <form id="taskForm">
                <label for="taskTitle">Task Title *</label>
                <input
                    type="text"
                    id="taskTitle"
                    placeholder="e.g. Complete assignment"
                    maxlength="100"
                    required
                >

                <label for="taskDescription">Description</label>
                <textarea
                    id="taskDescription"
                    placeholder="Write task details..."
                    maxlength="500"
                ></textarea>

                <label for="taskPriority">Priority</label>
                <select id="taskPriority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <label for="taskDate">Due Date</label>
                <input type="date" id="taskDate">

                <button type="submit" class="btn primary" id="submitBtn">
                    Add Task
                </button>

                <button
                    type="button"
                    class="btn secondary"
                    id="cancelBtn"
                    style="display:none; width:100%; margin-top:10px"
                >
                    Cancel Edit
                </button>
            </form>
        </section>

        <section class="panel">
            <h2>My Task List</h2>

            <div class="task-toolbar">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                    aria-label="Search tasks"
                >

                <select id="filterSelect" aria-label="Filter tasks">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="task-list" id="taskList"></div>
        </section>

    </div>
</main>

<footer>
    TaskFlow © 2026 | Stay organized, stay productive.
</footer>

<script>
const form = document.getElementById("taskForm");
const titleInput = document.getElementById("taskTitle");
const descriptionInput = document.getElementById("taskDescription");
const priorityInput = document.getElementById("taskPriority");
const dateInput = document.getElementById("taskDate");
const taskList = document.getElementById("taskList");
const searchInput = document.getElementById("searchInput");
const filterSelect = document.getElementById("filterSelect");

let tasks = [];

try {
    tasks = JSON.parse(localStorage.getItem("taskflowTasks")) || [];
    if (!Array.isArray(tasks)) tasks = [];
} catch (error) {
    tasks = [];
}

let editingId = null;

function saveTasks() {
    try {
        localStorage.setItem("taskflowTasks", JSON.stringify(tasks));
    } catch (error) {
        alert("Unable to save tasks in this browser.");
    }
}

function updateStats() {
    const total = tasks.length;
    const completed = tasks.filter(task => task.completed).length;
    const pending = total - completed;
    const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("totalCount").textContent = total;
    document.getElementById("completedCount").textContent = completed;
    document.getElementById("pendingCount").textContent = pending;
    document.getElementById("progressBar").style.width = percentage + "%";
    document.getElementById("progressText").textContent =
        percentage + "% completed";
}

function renderTasks() {
    taskList.replaceChildren();

    const search = searchInput.value.trim().toLowerCase();
    const filter = filterSelect.value;

    const filteredTasks = tasks.filter(task => {
        const matchesSearch =
            task.title.toLowerCase().includes(search) ||
            task.description.toLowerCase().includes(search);

        const matchesFilter =
            filter === "all" ||
            (filter === "completed" && task.completed) ||
            (filter === "pending" && !task.completed);

        return matchesSearch && matchesFilter;
    });

    if (filteredTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = tasks.length === 0
            ? "📝 No tasks yet. Add your first task!"
            : "No matching tasks found.";
        taskList.appendChild(empty);
    }

    filteredTasks.forEach(task => {
        const card = document.createElement("article");
        card.className = "task" + (task.completed ? " completed" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Mark task completed");

        checkbox.addEventListener("change", () => {
            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
        });

        const content = document.createElement("div");
        content.className = "task-content";

        const title = document.createElement("h3");
        title.textContent = task.title;

        const description = document.createElement("p");
        description.textContent = task.description || "No description";

        const priority = document.createElement("span");
        priority.className = "tag " + task.priority.toLowerCase();
        priority.textContent = task.priority + " Priority";

        content.append(title, description, priority);

        if (task.date) {
            const dateTag = document.createElement("span");
            dateTag.className = "tag";
            dateTag.textContent = "Due: " + task.date;
            content.appendChild(dateTag);
        }

        if (task.completed) {
            const doneTag = document.createElement("span");
            doneTag.className = "tag low";
            doneTag.textContent = "Completed";
            content.appendChild(doneTag);
        }

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const editButton = document.createElement("button");
        editButton.className = "small-btn edit-btn";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => editTask(task.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "small-btn delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteTask(task.id));

        actions.append(editButton, deleteButton);
        card.append(checkbox, content, actions);
        taskList.appendChild(card);
    });

    updateStats();
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const title = titleInput.value.trim();
    const description = descriptionInput.value.trim();

    if (!title) {
        alert("Please enter a task title.");
        titleInput.focus();
        return;
    }

    if (editingId !== null) {
        const task = tasks.find(item => item.id === editingId);

        if (task) {
            task.title = title;
            task.description = description;
            task.priority = priorityInput.value;
            task.date = dateInput.value;
        }
    } else {
        tasks.unshift({
            id: Date.now().toString() + Math.random().toString(36).slice(2),
            title: title,
            description: description,
            priority: priorityInput.value,
            date: dateInput.value,
            completed: false
        });
    }

    saveTasks();
    resetForm();
    renderTasks();
});

function editTask(id) {
    const task = tasks.find(item => item.id === id);
    if (!task) return;

    editingId = id;
    titleInput.value = task.title;
    descriptionInput.value = task.description;
    priorityInput.value = task.priority;
    dateInput.value = task.date || "";

    document.getElementById("formHeading").textContent = "✎ Edit Task";
    document.getElementById("submitBtn").textContent = "Save Changes";
    document.getElementById("cancelBtn").style.display = "block";

    document.getElementById("formHeading").scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

function deleteTask(id) {
    if (!confirm("Are you sure you want to delete this task?")) return;

    tasks = tasks.filter(task => task.id !== id);

    if (editingId === id) resetForm();

    saveTasks();
    renderTasks();
}

function resetForm() {
    form.reset();
    editingId = null;

    document.getElementById("formHeading").textContent = "＋ Add New Task";
    document.getElementById("submitBtn").textContent = "Add Task";
    document.getElementById("cancelBtn").style.display = "none";
    priorityInput.value = "Medium";
}

document.getElementById("cancelBtn").addEventListener("click", resetForm);

searchInput.addEventListener("input", renderTasks);
filterSelect.addEventListener("change", renderTasks);

renderTasks();
</script>

</body>
</html>
